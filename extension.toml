id = "orthra-lsp"
name = "Orthra"
description = "Spell checking for prose, comments, strings and the names you declare: fast, quiet, and local."
version = "0.1.0"
schema_version = 1
authors = ["Korob Labs <opensource@koroblabs.com>"]
repository = "https://github.com/koroblabs/orthra-zed"

# Every language orthra has a host for, by Zed's name, with the language id orthra reads it as. The
# names are the `name` in each language's `config.toml`, in Zed or in the extension that adds it
# (checked 2026-11-09: C# is `CSharp`, Vue is `Vue.js`, reStructuredText is `reST`). A language Zed
# knows only through another extension is listed all the same: Zed starts the server for it once
# that extension is installed. Docker Compose files are YAML, and `Text` is this extension's own
# language for a project's text files with no extension (`languages/text/`).
[language_servers.orthra]
name = "Orthra"
languages = [
  "Plain Text",
  "Text",
  "Markdown",
  "reST",
  "Git Commit",
  "Rust",
  "TypeScript",
  "TSX",
  "JavaScript",
  "Python",
  "Go",
  "PHP",
  "Java",
  "Kotlin",
  "Scala",
  "Groovy",
  "Swift",
  "Objective-C",
  "C",
  "C++",
  "CSharp",
  "FSharp",
  "Dart",
  "Zig",
  "Ruby",
  "Lua",
  "Elixir",
  "Erlang",
  "Haskell",
  "OCaml",
  "OCaml Interface",
  "Elm",
  "R",
  "Julia",
  "PowerShell",
  "Shell Script",
  "SQL",
  "HTML",
  "Vue.js",
  "Svelte",
  "CSS",
  "SCSS",
  "LESS",
  "XML",
  "Nix",
  "HCL",
  "Terraform",
  "Terraform Vars",
  "ini",
  "Properties",
  "TOML",
  "YAML",
  "Docker Compose",
  "JSON",
  "JSONC",
  "Proto",
  "GraphQL",
  "Make",
  "CMake",
  "Dockerfile",
]

[language_servers.orthra.language_ids]
"Plain Text" = "plaintext"
"Text" = "plaintext"
"Markdown" = "markdown"
"reST" = "restructuredtext"
